{% extends "base.html" %}

{% block title %}Passwort ändern - FBK-Time{% endblock %}

{% block content %}
<div class="grid">
    <div></div>
    <article>
        <hgroup>
            <h1>Passwort ändern</h1>
            <p>Bitte wählen Sie ein neues Passwort</p>
        </hgroup>

        <form method="POST" action="{{ url_for('auth.change_password') }}">
            {{ form.hidden_tag() }}

            <label>
                Aktuelles Passwort
                {% if form.current_password.errors %}
                {{ form.current_password(autocomplete="current-password", **{'aria-invalid': 'true'}) }}
                <small>{{ form.current_password.errors[0] }}</small>
                {% else %}
                {{ form.current_password(autocomplete="current-password") }}
                {% endif %}
            </label>

            <label>
                Neues Passwort
                {% if form.new_password.errors %}
                {{ form.new_password(autocomplete="new-password", placeholder=password_policy.placeholder, **{'aria-invalid': 'true'}) }}
                <small>{{ form.new_password.errors[0] }}</small>
                {% else %}
                {{ form.new_password(autocomplete="new-password", placeholder=password_policy.placeholder) }}
                <small>{% for req in password_policy.requirements %}{{ req }}{% if not loop.last %} · {% endif %}{% endfor %}</small>
                {% endif %}
            </label>

            <label>
                Neues Passwort bestätigen
                {% if form.new_password_confirm.errors %}
                {{ form.new_password_confirm(autocomplete="new-password", **{'aria-invalid': 'true'}) }}
                <small>{{ form.new_password_confirm.errors[0] }}</small>
                {% else %}
                {{ form.new_password_confirm(autocomplete="new-password") }}
                {% endif %}
            </label>

            <button type="submit">Passwort ändern</button>
        </form>
    </article>
    <div></div>
</div>
{% endblock %}
