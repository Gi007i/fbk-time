{% extends "base.html" %}

{% block title %}Anmelden - FBK-Time{% endblock %}

{% block content %}
<div class="grid">
    <div></div>
    <article>
        <hgroup>
            <h1>FBK-Time</h1>
            <p>Abwesenheitsmanagement</p>
        </hgroup>

        <form method="POST" action="{{ url_for('auth.login') }}">
            {{ form.hidden_tag() }}

            <label>
                Benutzername
                {% if form.username.errors %}
                {{ form.username(autocomplete="username", autofocus=true, **{'aria-invalid': 'true'}) }}
                <small>{{ form.username.errors[0] }}</small>
                {% else %}
                {{ form.username(autocomplete="username", autofocus=true) }}
                {% endif %}
            </label>

            <label>
                Passwort
                {% if form.password.errors %}
                {{ form.password(autocomplete="current-password", **{'aria-invalid': 'true'}) }}
                <small>{{ form.password.errors[0] }}</small>
                {% else %}
                {{ form.password(autocomplete="current-password") }}
                {% endif %}
            </label>

            <label>
                {{ form.remember() }}
                Angemeldet bleiben
            </label>

            <button type="submit">Anmelden</button>
        </form>

        {% if self_registration_enabled %}
        <hr>
        <p>Noch kein Konto? <a href="{{ url_for('auth.register') }}">Registrieren</a></p>
        {% endif %}
    </article>
    <div></div>
</div>
{% endblock %}
