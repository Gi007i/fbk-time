{% extends "base.html" %}

{% block title %}Mein Profil - FBK-Time{% endblock %}

{% block content %}
<h1>Mein Profil</h1>

<article>
    <header>
        <h2>Kontoinformationen</h2>
    </header>
    <figure>
        <table>
            <tbody>
                <tr>
                    <th scope="row">Benutzername</th>
                    <td>{{ current_user.username }}</td>
                </tr>
                <tr>
                    <th scope="row">Anzeigename</th>
                    <td>{{ current_user.name }}</td>
                </tr>
                {% if current_user.email %}
                <tr>
                    <th scope="row">E-Mail</th>
                    <td>{{ current_user.email }}</td>
                </tr>
                {% endif %}
                <tr>
                    <th scope="row">Rolle</th>
                    <td>
                        {% if current_user.role.value == 'admin' %}
                        Admin
                        {% elif current_user.role.value == 'manager' %}
                        Manager
                        {% else %}
                        Benutzer
                        {% endif %}
                    </td>
                </tr>
                <tr>
                    <th scope="row">Status</th>
                    <td>
                        {% if current_user.status.value == 'active' %}
                        Aktiv
                        {% elif current_user.status.value == 'pending' %}
                        Ausstehend
                        {% elif current_user.status.value == 'locked' %}
                        Gesperrt
                        {% else %}
                        Deaktiviert
                        {% endif %}
                    </td>
                </tr>
                <tr>
                    <th scope="row">Konto erstellt</th>
                    <td>{{ current_user.created_at|format_date }}</td>
                </tr>
                <tr>
                    <th scope="row">Letzter Login</th>
                    <td>
                        {% if current_user.last_login %}
                        {{ current_user.last_login|format_date(include_time=True) }}
                        {% else %}
                        &mdash;
                        {% endif %}
                    </td>
                </tr>
            </tbody>
        </table>
    </figure>
</article>

<article>
    <header>
        <h2>Sicherheit</h2>
    </header>
    <p>Ändern Sie hier Ihr Passwort, um die Sicherheit Ihres Kontos zu gewährleisten.</p>
    <a href="{{ url_for('auth.change_password') }}" role="button" class="outline">Passwort ändern</a>
</article>
{% endblock %}
