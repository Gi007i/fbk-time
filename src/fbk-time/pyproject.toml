[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fbk-time"
version = "2.0.0"
description = "FBK-Time (Fehlzeiten-Buchung und Koordination) — Web-based absence management with substitute tracking and holiday integration"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11.4"
authors = [
    {name = "FBK-Time"}
]
keywords = ["absence", "management", "flask", "calendar", "holidays"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Scheduling",
]

dependencies = [
    "Flask==3.1.3",
    "Flask-WTF==1.3.0",
    "Jinja2==3.1.6",
    "SQLAlchemy==2.0.54",
    "argon2-cffi==25.1.0",
    "holidays==0.105",
    "reportlab==5.0.1",
    "icalendar==7.3.0",
    "gunicorn==26.2.0",
]

[project.urls]
GitHub = "https://github.com/Gi007i/fbk-time"
GitLab = "https://gitlab.com/Gi007i/fbk-time"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = ["modules*", "core*", "utils*", "cli*"]
