stages:
  - prepare
  - release

prepare-release:
  stage: prepare
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^release\//
  before_script:
    - apk add --no-cache git sed
  script:
    - VERSION=$(echo "$CI_COMMIT_BRANCH" | sed 's|release/v||')
    - 'if ! echo "$VERSION" | grep -qE "^[0-9]+\.[0-9]+\.[0-9]+$"; then echo "Invalid version format: $VERSION (expected X.Y.Z)"; exit 1; fi'
    - TAG="v${VERSION}"
    - REPO_URL="https://gitlab.com/${CI_PROJECT_PATH}"
    - git config user.name "GitLab CI"
    - git config user.email "ci@gitlab.com"
    - PUSH_URL="https://oauth2:${RELEASE_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
    - git remote set-url origin "${PUSH_URL}"
    - git fetch origin main
    - git checkout main
    - git merge --squash "origin/release/v${VERSION}"
    - sed -i "s|__REPO_URL__|${REPO_URL}|g" README.md
    - sed -i "s|__REPO_URL__|${REPO_URL}|g" src/fbk-time/pyproject.toml
    - sed -i "s|__REPO_URL__|${REPO_URL}|g" src/fbk-time/static/css/fbk-custom.css
    - sed -i "s|__VERSION__|${VERSION}|g" src/fbk-time/pyproject.toml
    - git add -A
    - 'git commit -m "feat: release v${VERSION}"'
    - 'git tag -a "${TAG}" -m "Release ${TAG}"'
    - git push origin main
    - git push origin "${TAG}"
    - git push origin --delete "release/v${VERSION}"

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - VERSION=$(echo "$CI_COMMIT_TAG" | sed 's|^v||')
    - 'NOTES=$(awk -v ver="$VERSION" ''/^## \[/{if(found)exit;if(index($0,"["ver"]"))found=1;next}found{print}'' CHANGELOG.md)'
    - 'if [ -z "$NOTES" ]; then NOTES="No changelog entry found for version ${VERSION}."; fi'
    - echo "$NOTES" > release_notes.md
    - echo "" >> release_notes.md
    - echo "---" >> release_notes.md
    - 'echo "Full changelog: [CHANGELOG.md](https://gitlab.com/${CI_PROJECT_PATH}/-/blob/main/CHANGELOG.md)" >> release_notes.md'
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: ./release_notes.md
