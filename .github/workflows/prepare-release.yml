name: Prepare Release

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Extract version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#release/v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Preparing release v${VERSION}"
          echo "${VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "ERROR: Invalid version ${VERSION}"; exit 1; }

      - name: Prepare release commit
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          GITHUB_REPO_URL="https://github.com/${{ github.repository }}"
          GITLAB_REPO_URL="https://gitlab.com/Gi007i/fbk-time"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Squash-merge
          git checkout main
          git merge --squash "origin/${GITHUB_REF_NAME}"

          # Replace placeholders
          sed -i "s|__GITHUB_REPO_URL__|${GITHUB_REPO_URL}|g" README.md src/fbk-time/pyproject.toml src/fbk-time/static/css/fbk-custom.css
          sed -i "s|__GITLAB_REPO_URL__|${GITLAB_REPO_URL}|g" README.md src/fbk-time/pyproject.toml src/fbk-time/static/css/fbk-custom.css
          sed -i "s|__VERSION__|${VERSION}|g" src/fbk-time/pyproject.toml

          git add -A
          git commit -m "feat: release v${VERSION}"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin main
          git push origin "${TAG}"

          # Cross-push to GitLab
          git push "https://oauth2:${GITLAB_TOKEN}@gitlab.com/Gi007i/fbk-time.git" main || echo "WARNING: GitLab push (main) failed"
          git push "https://oauth2:${GITLAB_TOKEN}@gitlab.com/Gi007i/fbk-time.git" "${TAG}" || echo "WARNING: GitLab push (tag) failed"

          # Delete release branch
          git push origin --delete "${GITHUB_REF_NAME}" || true
